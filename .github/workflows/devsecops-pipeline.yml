name: DevSecOps CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run SAST Security Scan (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit p/secrets
